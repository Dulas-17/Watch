<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DLS Encoder v3</title>
<!-- DLS Encoder v3 -->
<style>
:root{--bg:#0b0e14;--panel:#121722;--panel2:#181f2d;--line:#242d3f;--text:#e9eef7;--mute:#8a96ab;--a:#7c9cff;--b:#b18cff;--ok:#42d392;--bad:#ff6b7a;--r:16px;--font:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(900px 500px at 15% -10%,#1b2447 0,transparent 60%),radial-gradient(700px 400px at 100% 0,#2a1b47 0,transparent 55%),var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;padding:28px 16px 60px}
.wrap{max-width:760px;margin:0 auto}
h1{font-size:1.9rem;letter-spacing:-.02em;font-weight:700}
.sub{color:var(--mute);margin:6px 0 24px;font-size:.95rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:16px}
.drop{border:1.5px dashed #34405a;border-radius:var(--r);padding:34px 16px;text-align:center;cursor:pointer;transition:.2s;background:var(--panel2)}
.drop:hover,.drop.over{border-color:var(--a);background:#1a2340}
.drop b{display:block;font-size:1.05rem;margin-bottom:4px}.drop span{color:var(--mute);font-size:.85rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.files{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.f{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.f .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.9rem}
.f .s{color:var(--mute);font-size:.78rem;white-space:nowrap}
.f button{background:none;border:0;color:var(--mute);font-size:1rem;cursor:pointer}.f button:hover{color:var(--bad)}
.f.done{border-color:#1f5b44}.f.err{border-color:#6b2a33}
label.t{display:flex;gap:10px;align-items:flex-start;cursor:pointer;padding:10px 12px;border:1px solid var(--line);border-radius:12px;flex:1 1 240px;background:var(--panel2)}
label.t:has(input:checked){border-color:var(--a);background:#1a2340}
label.t input{margin-top:3px;accent-color:var(--a)}
label.t small{display:block;color:var(--mute);font-size:.78rem;margin-top:2px}
.pw{position:relative;margin-top:14px}
.pw input{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 44px 12px 14px;color:var(--text);font-size:.95rem}
.pw input:focus{outline:2px solid var(--a);border-color:transparent}
.pw button{position:absolute;right:6px;top:6px;background:none;border:0;font-size:1.1rem;cursor:pointer;padding:6px}
.bar{height:4px;background:var(--line);border-radius:4px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;width:0;transition:.2s}
.hint{color:var(--mute);font-size:.8rem;margin-top:6px}
.kf{margin-top:14px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}
.mini{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:9px;padding:8px 12px;font-size:.82rem;font-weight:600;cursor:pointer}.mini:hover{border-color:var(--a)}
.hide{display:none!important}
.go{width:100%;margin-top:16px;padding:14px;border:0;border-radius:12px;font-weight:700;font-size:1rem;color:#0b0e14;cursor:pointer;background:linear-gradient(90deg,var(--a),var(--b))}
.go:hover:not(:disabled){filter:brightness(1.1)}.go:disabled{opacity:.45;cursor:not-allowed}
.prog{display:none;margin-top:16px}
.prog .top{display:flex;justify-content:space-between;font-size:.82rem;color:var(--mute);gap:8px}
.prog .top span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog .bg{height:8px;background:var(--line);border-radius:8px;margin-top:6px;overflow:hidden}
.prog .bg i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b));transition:width .15s}
.msg{margin-top:12px;font-size:.88rem;display:none;padding:10px 12px;border-radius:10px}
.msg.ok{display:block;background:#12281f;color:var(--ok)}.msg.bad{display:block;background:#2b141a;color:var(--bad)}
.save{display:block;margin-top:8px;padding:11px 14px;border:1px solid var(--a);border-radius:12px;color:var(--a);text-decoration:none;font-weight:600;font-size:.9rem;word-break:break-all}
footer{color:var(--mute);font-size:.75rem;text-align:center;margin-top:24px}

/* v3 fluid layout */
html{scroll-behavior:smooth;scroll-padding:12px 0 96px;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
body{min-height:100dvh;padding:clamp(14px,4vw,28px) max(clamp(12px,4vw,16px),env(safe-area-inset-right)) calc(56px + env(safe-area-inset-bottom)) max(clamp(12px,4vw,16px),env(safe-area-inset-left))}
h1{font-size:clamp(1.5rem,6vw,1.9rem);display:flex;align-items:center;gap:10px}
.ver{font-size:.7rem;font-weight:600;color:var(--mute);border:1px solid var(--line);border-radius:20px;padding:2px 9px;letter-spacing:0}
.sub{margin:4px 0 18px;font-size:.9rem}
.card{padding:14px;margin-bottom:12px}
.drop{padding:22px 12px}.drop b{font-size:1rem}
input,button{font-family:inherit}
.pw input,.pwrow input{font-size:16px}
.mini{min-height:40px}
footer{margin-top:16px}
.f{padding:9px 10px}.f button{min-width:36px;min-height:36px}
label.t{flex:1 1 150px;padding:10px}
.kf{padding:12px}.mini{flex:1 1 auto}
.go{min-height:48px;position:sticky;bottom:max(10px,env(safe-area-inset-bottom));box-shadow:0 8px 24px rgba(0,0,0,.45)}
.go.plain{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
</style>
</head>
<body>
<div class="wrap">
  <h1>DLS Encoder <span class="ver">v3</span></h1>
  <p class="sub">Pack files into one encrypted .dls</p>

  <div class="card">
    <div class="drop" id="drop"><b>Add files</b><span>Tap or drop here</span></div>
    <input type="file" id="inp" multiple hidden>
    <div class="files" id="list"></div>
  </div>

  <div class="card">
    <div class="row">
      <label class="t"><input type="radio" name="mode" value="single" checked><div>One archive<small>Everything in one .dls</small></div></label>
      <label class="t"><input type="radio" name="mode" value="each"><div>One per file<small>Separate .dls each</small></div></label>
    </div>
    <div class="pw">
      <input type="password" id="pwd" placeholder="Password (optional)" autocomplete="new-password">
      <button id="eye" type="button" aria-label="Show password">👁️</button>
    </div>
    <div class="bar"><i id="str"></i></div>
    <p class="hint" id="strTxt"></p>

    <div class="kf">
      <label class="row" style="cursor:pointer"><input type="checkbox" id="kfOn" style="accent-color:var(--a)"><b style="font-size:.92rem">Use a key file</b></label>
      <div id="kfBox" class="hide" style="margin-top:10px">
        <div class="row"><button class="mini" id="kfGen" type="button">New key file</button><button class="mini" id="kfPick" type="button">Choose file</button></div>
        <p class="hint" id="kfStat">Needed again to decode.</p>
      </div>
      <input type="file" id="kfInp" hidden>
    </div>

    <button class="go" id="go" disabled>Create .dls</button>
    <div class="prog" id="prog"><div class="top"><span id="pl">Starting…</span><span id="pp">0%</span></div><div class="bg"><i id="pf"></i></div></div>
    <div class="msg" id="msg"></div>
    <div id="saves"></div>
  </div>
  <footer>DLS Encoder v3 · AES-256-GCM</footer>
</div>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const CHUNK = 8 * 1024 * 1024, ITER = 600000;
const enc = new TextEncoder();
let files = [], busy = false, kf = null;
const fmt = b => b >= 1073741824 ? (b/1073741824).toFixed(2)+' GB' : (b/1048576).toFixed(b<1048576?3:1)+' MB';

const reveal = el => { try { el.scrollIntoView({block:'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'}); } catch {} };
function goLabel() {
  const plain = !$('pwd').value && !($('kfOn').checked && kf);
  $('go').textContent = (plain ? 'Pack, no encryption' : 'Encrypt & pack') + (files.length > 1 ? ` · ${files.length} files` : '');
  $('go').classList.toggle('plain', plain);
}

/* ---------- File list ---------- */
function render() {
  $('list').innerHTML = '';
  files.forEach((f, i) => {
    const d = document.createElement('div');
    d.className = 'f' + (f._st === 'done' ? ' done' : f._st === 'err' ? ' err' : '');
    d.innerHTML = '<span>' + (f._st==='done'?'✅':f._st==='err'?'❌':'📄') + '</span><span class="n"></span><span class="s">' + fmt(f.size) + '</span><button title="Remove">✕</button>';
    d.querySelector('.n').textContent = f.name;
    d.querySelector('button').onclick = () => { if (!busy) { files.splice(i, 1); render(); } };
    $('list').appendChild(d);
  });
  $('go').disabled = !files.length || busy;
  goLabel();
}
function add(list) {
  for (const f of list) if (!files.some(x => x.name===f.name && x.size===f.size && x.lastModified===f.lastModified)) files.push(f);
  render();
}
$('drop').onclick = () => $('inp').click();
$('inp').onchange = e => { add(e.target.files); e.target.value = ''; };
['dragenter','dragover'].forEach(t => $('drop').addEventListener(t, e => { e.preventDefault(); $('drop').classList.add('over'); }));
['dragleave','drop'].forEach(t => $('drop').addEventListener(t, e => { e.preventDefault(); $('drop').classList.remove('over'); }));
$('drop').addEventListener('drop', e => add(e.dataTransfer.files));
$('eye').onclick = () => { const p = $('pwd'); p.type = p.type==='password' ? 'text' : 'password'; };
$('pwd').oninput = () => {
  const p = $('pwd').value; let s = 0;
  if (p.length>=8) s++; if (p.length>=12) s++; if (/[a-z]/.test(p)&&/[A-Z]/.test(p)) s++; if (/\d/.test(p)&&/[^\w]/.test(p)) s++;
  const bar = $('str'); bar.style.width = p ? (s*25)+'%' : '0'; bar.style.background = s<=1?'var(--bad)':s<=2?'#f0a24b':'var(--ok)';
  $('strTxt').textContent = p ? ['Weak','Weak','Okay','Good','Strong'][s] : ''; goLabel();
};
function msg(t, k) { const m = $('msg'); m.textContent = t; m.className = 'msg ' + k; reveal(m); }
function prog(label, pct) { if ($('prog').style.display !== 'block') { $('prog').style.display = 'block'; reveal($('prog')); } $('pl').textContent = label; $('pp').textContent = Math.round(pct)+'%'; $('pf').style.width = pct+'%'; }

/* ---------- Key file ---------- */
async function kfId(b) {
  if (!window.crypto?.subtle) return '?';
  const h = new Uint8Array(await crypto.subtle.digest('SHA-256', b));
  return Array.from(h.slice(0, 4), x => x.toString(16).padStart(2, '0')).join('');
}
async function kfSet(bytes, text) {
  kf = bytes; $('kfStat').textContent = text; goLabel();
  if (bytes) $('kfStat').textContent = text + ' · ID ' + await kfId(bytes);
}
$('kfOn').onchange = () => { $('kfBox').classList.toggle('hide', !$('kfOn').checked); goLabel(); };
$('kfGen').onclick = () => {
  if (kf && !confirm('Replace the current key file? Archives made with the old key need the old file.')) return;
  const b = crypto.getRandomValues(new Uint8Array(32)), name = 'dls-' + new Date().toISOString().slice(0, 10) + '-' + Math.random().toString(16).slice(2, 6) + '.key';
  const url = URL.createObjectURL(new Blob([b], {type:'application/octet-stream'}));
  const a = saveLink(name, name, url); a.classList.add('keep'); a.click();
  kfSet(b, 'Saved ' + name + ' · keep a backup');
};
$('kfPick').onclick = () => $('kfInp').click();
$('kfInp').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  if (!f.size) { kfSet(null, 'File is empty.'); return; }
  if (f.size > 50 * 1048576) { kfSet(null, 'Max 50 MB.'); return; }
  kfSet(new Uint8Array(await f.arrayBuffer()), f.name);
};
function saveLink(label, name, url) { // visible link, so saving works even if the browser blocks automatic downloads
  const a = document.createElement('a'); a.href = url; a.download = name; a.className = 'save'; a.textContent = '⬇ Save: ' + label;
  $('saves').appendChild(a); reveal(a); return a;
}

/* ---------- Crypto ---------- */
async function getKey(pw, salt, key) {
  let m = enc.encode(pw);
  if (key) { // password + 0x00 + SHA-256(key file)
    const h = new Uint8Array(await crypto.subtle.digest('SHA-256', key)), x = new Uint8Array(m.length + 33);
    x.set(m); x.set(h, m.length + 1); m = x;
  }
  const km = await crypto.subtle.importKey('raw', m, 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:ITER, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['encrypt']);
}
async function gzip(u8) {
  if (!window.CompressionStream) return null;
  try { return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer()); }
  catch { return null; }
}
const NOCOMP = /^(video|audio|image)\/|zip|rar|7z|gzip|bzip|compressed|octet-stream/i;
const NOCOMP_EXT = /\.(mp4|mkv|mov|avi|webm|mp3|aac|flac|ogg|m4a|jpe?g|png|gif|webp|zip|rar|7z|gz|bz2|xz|apk)$/i;

/* ---------- Writers ---------- */
async function openWriter(name, usePicker) {
  if (usePicker && window.showSaveFilePicker) {
    const h = await window.showSaveFilePicker({suggestedName:name, types:[{description:'DLS archive', accept:{'application/octet-stream':['.dls']}}]});
    const w = await h.createWritable();
    return { write: u8 => w.write(u8), close: () => w.close(), abort: () => w.abort().catch(() => {}), direct: true };
  }
  let parts = [], n = 0;
  return {
    write: async u8 => { parts.push(u8); if (++n % 8 === 0) parts = [new Blob(parts)]; },
    close: async () => {
      const blob = new Blob(parts, {type:'application/octet-stream'});
      saveLink(name + ' (' + fmt(blob.size) + ')', name, URL.createObjectURL(blob)).click();
    },
    abort: async () => { parts = []; }
  };
}

/* ---------- Format (DLS v2, big-endian) ----------
 Header: "DLS2" | version u8=2 | flags u8 (1=encrypted, 2=key file) | iterations u32 | salt 16B
 Records: type u8 | length u32 | payload      (seq number starts at 0, +1 per record)
   1 = file start  (JSON {name,type,size,lastModified})
   2 = data chunk  (flag u8 [0 raw, 1 gzip] + bytes)
   3 = file end    (empty)
   255 = archive end (JSON {files:n})
 If encrypted: payload = iv(12B) + AES-GCM(plaintext, additionalData = seq as u32 BE).
*/
async function writeArchive(list, pw, key, out, onProgress) {
  const encrypted = !!pw || !!key;
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const ck = encrypted ? await getKey(pw, salt, key) : null;
  const head = new Uint8Array(26), hv = new DataView(head.buffer);
  head.set(enc.encode('DLS2')); hv.setUint8(4, 2); hv.setUint8(5, (encrypted ? 1 : 0) | (key ? 2 : 0)); hv.setUint32(6, ITER); head.set(salt, 10);
  await out.write(head);
  let seq = 0;
  const rec = async (type, plain) => {
    let payload = plain;
    if (encrypted) {
      const iv = crypto.getRandomValues(new Uint8Array(12)), aad = new Uint8Array(4);
      new DataView(aad.buffer).setUint32(0, seq);
      const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv, additionalData:aad}, ck, plain));
      payload = new Uint8Array(12 + ct.length); payload.set(iv); payload.set(ct, 12);
    }
    const r = new Uint8Array(5 + payload.length);
    r[0] = type; new DataView(r.buffer).setUint32(1, payload.length); r.set(payload, 5);
    seq++; await out.write(r);
  };
  const total = list.reduce((s, f) => s + f.size, 0) || 1; let done = 0;
  for (const f of list) {
    await rec(1, enc.encode(JSON.stringify({name:f.name, type:f.type||'application/octet-stream', size:f.size, lastModified:f.lastModified})));
    const tryComp = !(NOCOMP.test(f.type) || NOCOMP_EXT.test(f.name));
    for (let off = 0; off < f.size; off += CHUNK) {
      let raw = new Uint8Array(await f.slice(off, off + CHUNK).arrayBuffer()), flag = 0;
      if (tryComp) { const c = await gzip(raw); if (c && c.length < raw.length) { raw = c; flag = 1; } }
      const p = new Uint8Array(1 + raw.length); p[0] = flag; p.set(raw, 1);
      await rec(2, p);
      done += Math.min(CHUNK, f.size - off);
      onProgress(f.name, done / total * 100);
      await new Promise(r => setTimeout(r, 0));
    }
    await rec(3, new Uint8Array(0));
  }
  await rec(255, enc.encode(JSON.stringify({files:list.length})));
}

/* ---------- Run ---------- */
$('go').onclick = async () => {
  if (busy || !files.length) return;
  const useKf = $('kfOn').checked;
  if (useKf && !kf) { msg('Add a key file first.', 'bad'); return; }
  if ((useKf || $('pwd').value) && !window.crypto?.subtle) { msg('Encryption needs a secure (https) page.', 'bad'); return; }
  busy = true; render(); $('msg').className = 'msg'; $('saves').querySelectorAll('.save:not(.keep)').forEach(x => x.remove());
  files.forEach(f => f._st = '');
  const pw = $('pwd').value, key = useKf ? kf : null, single = document.querySelector('input[name=mode]:checked').value === 'single';
  const jobs = single ? [{list:files, name:(files.length===1 ? files[0].name.replace(/\.[^.]+$/,'') : 'archive') + '.dls'}]
                      : files.map(f => ({list:[f], name:f.name.replace(/\.[^.]+$/,'') + '.dls'}));
  let ok = 0, direct = true;
  try {
    for (let j = 0; j < jobs.length; j++) {
      const job = jobs[j]; let out;
      try { out = await openWriter(job.name, jobs.length === 1); } // save dialog must open right on the tap
      catch (e) { if (e.name === 'AbortError') { msg('Cancelled.', 'bad'); break; } throw e; }
      if (!out.direct) direct = false;
      try {
        await writeArchive(job.list, pw, key, out, (n, p) => prog(n, (j + p/100) / jobs.length * 100));
        await out.close(); job.list.forEach(f => f._st = 'done'); ok += job.list.length;
      } catch (e) { await out.abort(); job.list.forEach(f => f._st = 'err'); console.error(e); msg('Failed: ' + (e.message || e), 'bad'); }
      render();
    }
    prog('Done', 100);
    if (ok === files.length) msg(direct ? 'Saved.' : 'Done. Tap Save below if nothing downloaded.', 'ok');
  } finally { busy = false; render(); }
};
/* ---------- Scroll memory ---------- */
try {
  const KEY = 'dls_enc_scroll', saved = parseInt(localStorage.getItem(KEY), 10);
  if (saved > 0) { if ('scrollRestoration' in history) history.scrollRestoration = 'manual'; requestAnimationFrame(() => scrollTo(0, saved)); }
  let t = 0;
  addEventListener('scroll', () => { if (t) return; t = requestAnimationFrame(() => { t = 0; try { localStorage.setItem(KEY, String(Math.round(scrollY))); } catch {} }); }, {passive:true});
} catch {}

render();
console.log('DLS Encoder v3');
})();
</script>
</body>
</html>
